name: Build AI Talk APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Extract Android source
        run: |
          unzip -q AI_Talk_Mobile_S26_PhoneBuild.zip
          ls -la AI_Talk_Mobile_S26

      - name: Fix Android layout parameter
        run: |
          sed -i 's/ScrollView.LayoutParams(-1, -2)/android.widget.FrameLayout.LayoutParams(-1, -2)/' \
          AI_Talk_Mobile_S26/app/src/main/java/com/eand/aitalkmobile/MainActivity.kt

      - name: Build debug APK
        working-directory: AI_Talk_Mobile_S26
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Talk-Mobile-S26-APK
          path: AI_Talk_Mobile_S26/app/build/outputs/apk/debug/app-debug.apk
